name: HACS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch breakage from new Home Assistant releases rather than at install time.
    - cron: "23 6 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          # Repository description and topics are only required to be listed in
          # the HACS default store, which this fork is not.
          ignore: brands

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Home Assistant integration tests
        run: |
          uv run --isolated --python 3.14 \
            --with-requirements requirements-ha-test.txt pytest tests_ha/ -q
